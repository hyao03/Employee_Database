name: macOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller cryptography pillow

      - name: Ensure data directory exists
        run: |
          if [ ! -d "data" ]; then
            mkdir -p data
            touch data/.gitkeep
          fi

      - name: Build macOS app bundle
        run: python build_macos.py

      - name: List dist contents
        run: ls -R dist

      - name: Upload built macOS app
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeDatabase-macos-app
          path: dist/EmployeeDatabase.app
